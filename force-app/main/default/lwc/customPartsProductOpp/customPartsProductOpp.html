<template>
    <template if:true={showModal}>
        <section role="dialog" class="slds-modal slds-fade-in-open slds-modal_large" tabindex="-1" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <!-- X Close Button -->
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <!-- Title -->
                    <h2 class="slds-text-heading_medium">Custom Part</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-flow
                        flow-api-name="Custom_Part_Additional_Fields_Screen_Flow"
                        flow-input-variables={flowVariables}
                        onstatuschange={handleFlowStatus}>
                    </lightning-flow>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
