<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Cloning Product..." size="medium"></lightning-spinner>
    </template>

    <lightning-quick-action-panel header={headerName}>
        <div class="slds-p-around_medium">
            <lightning-input label="Product Name" value={productName} onchange={handleNameChange}></lightning-input>
        </div>

        <div slot="footer" class="slds-align_absolute-center">
            <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button variant="brand" label="Save" onclick={handleSave}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
