<template>
    <lightning-quick-action-panel header="Schedule Lines Search Details">
         <template if:true={isLoading}>
             <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
         </template>
         <div style="height: 300px;" if:true={allSearchResult.length}>
					<lightning-datatable key-field="SerialNo" data={allSearchResult} max-row-selection="1"
						onrowselection={handleRowSelected} columns={columns}>
					</lightning-datatable>
				</div>
        <div if:true={showErrorTable}>
					<lightning-datatable key-field="SerialNo" data={errorData} hide-checkbox-column
						 columns={errorColumns}>
					</lightning-datatable>
				</div>
    </lightning-quick-action-panel>
</template>
