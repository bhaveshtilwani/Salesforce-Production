<template>
    <div class="slds-p-around_medium">

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner 
                alternative-text="Loading" 
                size="small">
            </lightning-spinner>
        </template>

        <!-- Content -->
        <template if:false={isLoading}>
            <div class="slds-text-heading_medium slds-m-bottom_medium">
                Select Case Type
            </div>

            <lightning-radio-group
                name="caseType"
                label="Which type of case do you want to create?"
                options={caseTypeOptions}
                value={selectedType}
                type="radio"
                onchange={handleTypeChange}>
            </lightning-radio-group>

            <template if:true={showError}>
                <p class="slds-text-color_error slds-m-top_small">
                    ⚠️ Please select a case type.
                </p>
            </template>
        </template>

    </div>

    <div class="slds-modal__footer">
        <lightning-button
            label="Cancel"
            onclick={handleCancel}
            class="slds-m-right_small">
        </lightning-button>
        <lightning-button
            variant="brand"
            label="Next"
            onclick={handleNext}
            disabled={isLoading}>
        </lightning-button>
    </div>
</template>
