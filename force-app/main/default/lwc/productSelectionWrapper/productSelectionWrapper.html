<template>
    <lightning-card>
        <!-- Spinner -->
        <template if:true={showSpinner}>
            <div>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>
        <!-- Lightning Card Title -->
        <div slot="title">
            <div class="slds-text-heading_medium">Product Selection</div>
            <div class="slds-text-body_regular">Please enter a product name to search</div>
        </div>
        <!-- Lightning Card Footer -->
        <div slot="footer">
            <div class="slds-text-align_right">
                <lightning-button
                    variant="destructive-text"
                    class="slds-var-m-right_medium"
                    label="Cancel"
                    title="Cancel"
                    onclick={handleCancel}
                ></lightning-button>
                <!-- <lightning-button variant="brand" label="Save" title="Save" onclick={handleSave}></lightning-button> -->
                <button class="slds-button slds-button_brand slds-size_1-of-12 slds-button_stretch" title="Save" onclick={handleSave}>
                    <label>Save</label>
                </button>
            </div>
        </div>
        <!-- Modals -->
        <c-create-standard-mapping order-creation-id={orderCreationId}></c-create-standard-mapping>
        <c-product-selection-tile-edit-pop-up order-creation-id={orderCreationId}></c-product-selection-tile-edit-pop-up>
        <!-- Lightning Card Body -->
        <div class="slds-var-m-around_small">
            <!-- Filters -->
            <c-product-selection-filter order-creation-id={orderCreationId}></c-product-selection-filter>
            <!-- Table -->
            <c-product-selection-table order-creation-id={orderCreationId}></c-product-selection-table>
            <!-- Selected Products -->
            <c-product-selection-tile-wrapper
                onsavefailure={handleOnSaveFailure}
                onsavesuccess={handleOnSaveSuccess}
                order-creation-id={orderCreationId}
            ></c-product-selection-tile-wrapper>
            <!-- Scroll Buttons -->
            <lightning-button-icon
                if:true={showScrollToTopButton}
                icon-name="utility:arrowup"
                alternative-text="Scroll to Top"
                class="floating-button-top-right"
                variant="border-filled"
                onclick={handleScrollToTop}
                ><label>Scroll to Top</label>
            </lightning-button-icon>
            <lightning-button-icon
                if:true={showScrollToBottomButton}
                icon-name="utility:arrowdown"
                alternative-text="Scroll to Bottom"
                class="floating-button-bottom-right"
                variant="border-filled"
                onclick={handleScrollToBottom}
                ><label>Scroll to Bottom</label>
            </lightning-button-icon>
        </div>
    </lightning-card>
</template>
