<template>
	<lightning-card title="My Open Tasks regarding Complaints">
		<lightning-button-icon
		slot="actions"
		icon-name="utility:refresh"
		alternative-text="Refresh"
		title="Refresh"
		onclick={handleRefresh}></lightning-button-icon>
		<template if:true={isLoading}>
			<lightning-spinner
alternative-text="Loading"
size="medium"></lightning-spinner>
		</template>
		<template if:true={hasData}>
			<div style="overflow:auto; max-height:500px;">
				<lightning-datatable
key-field="taskId"
data={pagedData}
columns={columns}
hide-checkbox-column
column-widths-mode="fixed"></lightning-datatable>
			</div>
		</template>
		<template if:false={hasData}>
			<div class="slds-align_absolute-center slds-p-around_large">
				<lightning-icon
icon-name="utility:info"
size="small"></lightning-icon>
				<span class="slds-p-left_small">
No data for now
</span>
			</div>
		</template>
		<template if:true={showPagination}>
			<div class="slds-p-around_small slds-align_absolute-center">
				<lightning-button
label="Previous"
onclick={handlePrevious}
disabled={disablePrevious}></lightning-button>
				<span class="slds-p-horizontal_medium">
Page {pageNumber} of {totalPages}
</span>
				<lightning-button
label="Next"
onclick={handleNext}
disabled={disableNext}></lightning-button>
			</div>
		</template>
	</lightning-card>
</template>
