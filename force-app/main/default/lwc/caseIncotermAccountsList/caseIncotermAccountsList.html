<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="slds-icon_container slds-icon-standard-account" title="Account">
                        <lightning-icon icon-name="custom:custom76" size="medium" alternative-text="Incoterm Accounts List"></lightning-icon>
                    </span>
                </div>
                <div class="slds-media__body">
                    <h2>
                        <div class="slds-card__header-link slds-truncate" title="Incoterm Accounts">
                            <span class="slds-text-heading_small">Incoterm Accounts</span>
                        </div>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body">
            <table class="slds-table slds-table_bordered slds-no-row-hover slds-table_cell-buffer">
                <thead>
                    <tr class="slds-text-title_caps">
                        <th scope="col">
                            <div class="slds-truncate" title="Name">ERP Account Name</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="PKI_Site__c">Excelitas Site</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Incoterm__c">Incoterm</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Shipping_Terms__c">Shipping Terms</div>
                        </th>
                        <th scope="col">
                            <div class="slds-truncate" title="Shipping_Terms_Desc_1__c">Shipping Terms Description</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={accounts} for:item="record">
                        <tr key={record.id} data-id={record.id}>
                            <td>
                                <a onclick={handleRecordClick} data-id={record.id}>{record.name}</a>
                            </td>
                            <td>{record.site}</td>
                            <td>{record.incoterm}</td>
                            <td>{record.shippingTerms}</td>
                            <td>{record.shippingTermsDesc1}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <footer class="slds-card__footer"></footer>
    </article>
</template>
