<!--
    @description       : This Quote Order Converter LWC is called from lightning Quote Search tab
    @author            : Jade Global
    @last modified on  : 04-22-2021
    @last modified by  : Jade Global
    Modifications Log
    Ver   Date         Author        Modification
    1.0   02-18-2021   Jade Global   Initial Version
-->
<template>
    <template if:false={loaded}>
        <lightning-spinner style="position: fixed;" variant="brand" size="large" alternative-text="Loading...">
        </lightning-spinner>
    </template>
    <lightning-card>
        <header class="slds-modal__header" style="line-height:1px;">
            <h3 id="modal-heading-01" class="slds-modal__title slds-hyphenate"
                style="text-align: left;font-weight: bold;font-size: large;">Quote to Order Converter Page</h3>
        </header>
        <div class="c-container test">
            <lightning-accordion allow-multiple-sections-open class="example-accordion" active-section-name="A"
                style="padding-left:10px; padding-right:10px;">
                <template if:false={showAppendLinesBTN}>
                    <header>
                        <div class="slds-text-heading_medium"
                            style="background-color: rgb(243, 242, 242); font-size: medium; padding: 7px; margin: 10px;">
                            <p style="font-weight: bold;" class="slds-var-m-top_xx-small"> User Entered Details Section </p>
                        </div>
                    </header>
                    <div>
                        <template if:true={isShowTotal}>
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Account Name:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span>{accountName}</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Order Type:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span>{orderType}</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">PO Number:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <lightning-input type="text" label="PO Number:" value={poNumberEntered} onchange={handlePOnumberChange}
                                        name="openConfirmation" required>
                                    </lightning-input>
                                </div>

                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Bill/Sold To Account:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <div class="slds-grid">
                                        <div class="slds-col slds-size_9-of-12">
                                            <c-lwc-custom-lookup id="billToAccountId" ltng-icon-name="standard:account" query-object-api-name="Account"
                                                main-object-api-name="Account" id-field="Id" name-field="Name" scroll-after-n-items=5 result-display-size=10
                                                placeholder="Search Account..." additional-seach-keyword-fields="ERP_Site__c"
                                                onselectionchange={handleBillToAccountChange} selection={listBillToAccountLookup}
                                                additional-fields="Client_Side_ID__c,BillingCountry,BillingState,BillingCity,CurrencyIsoCode"
                                                nothing-found-subtitle="No accounts were found on the selected site"
                                                additional-where-clause={whereBillERPSite}>
                                            </c-lwc-custom-lookup>
                                        </div>
                                        <div class="slds-col slds-size_3-of-12">
                                            <lightning-button label="PF" onclick={showModal}>
                                            </lightning-button>
                                        </div>
                                    </div>
                                    <template if:true={openModal}>
                                        <div class="slds-modal slds-fade-in-open slds-backdrop">
                                            <div class="slds-modal__container">
                                                <div class="slds-modal__header">
                                                    <lightning-button-icon icon-name="utility:close" alternative-text="Close this window" size="large"
                                                        variant="bare-inverse" onclick={closeModal} class="slds-modal__close">
                                                    </lightning-button-icon>
                                                    <h2>Choose Partner Function</h2>
                                                </div>
                                                <div class="slds-modal__content slds-p-around_large  slds-scrollable">
                                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered" border="1" cellspacing="0"
                                                        cellpadding="0" style="border: 1 px solid #ccc;border-collapse:collapse;">
                                                        <thead>
                                                            <tr>
                                                                <th>Sold To/Ship To</th>
                                                                <th>ERP ID</th>
                                                                <th>Partner Function Type</th>
                                                                <th>Address</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template for:each={records} for:item="PFItem" for:index="index">
                                                                <tr key={PFItem.Id}>
                                                                    <td>
                                                                        <div>

                                                                            <lightning-button variant="base" label={PFItem.Partner__r.Name}
                                                                                value={PFItem.Partner__c} title="Populate to Ship To Account"
                                                                                onclick={PopulatePartnerFunction} class="slds-m-left_x-small"
                                                                                data-index={index}>
                                                                            </lightning-button>
                                                                        </div>
                                                                    </td>
                                                                    <td>{PFItem.ERP_ID__c}</td>
                                                                    <td>{PFItem.Partner_Function_Type__r.Name}</td>
                                                                    <td>{PFItem.Partner__r.BillingStreet},
                                                                        {PFItem.Partner__r.BillingCity},
                                                                        {PFItem.Partner__r.BillingState},
                                                                        {PFItem.Partner__r.BillingPostalCode},
                                                                        {PFItem.Partner__r.BillingCountry}</td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <!---Footer Section-->
                                                <div class="slds-modal__footer">
                                                    <lightning-button icon-name="utility:close" label="close" variant="brand" onclick={closeModal}>
                                                    </lightning-button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Ship To Account:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <c-lwc-custom-lookup id="shipToAccountId" ltng-icon-name="standard:account" query-object-api-name="Account"
                                        main-object-api-name="Account" id-field="Id" name-field="Name" scroll-after-n-items=5 result-display-size=10
                                        placeholder="Search Account..." additional-seach-keyword-fields="Name" onselectionchange={handleShipToAccountChange}
                                        nothing-found-subtitle="No accounts were found on the selected site"
                                        selection={listShipToAccountLookup} additional-where-clause={whereShipERPSite}>
                                    </c-lwc-custom-lookup>
                                </div>

                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">PO Date:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <lightning-input type="date" name="input1" variant="label-hidden" onchange={handlePoDateChange} value={PODate}>
                                    </lightning-input>
                                </div>

                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Order Reason:</span>
                                </div>
                                <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                    <c-lwc-custom-lookup id="orderReason" ltng-icon-name="custom:custom11" query-object-api-name="Order_Reason__c"
                                        main-object-api-name="Order_Reason__c" id-field="Id" name-field="Name" scroll-after-n-items=5 result-display-size=10
                                        placeholder="Select Order Reason..." onselectionchange={handleOrderReasonChange}
                                        nothing-found-subtitle="No Order Reasons were found on the selected site"
                                        additional-where-clause={whereERPSite}>
                                    </c-lwc-custom-lookup>
                                </div>

                                <template if:true={showBillericaFields}>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Bill To Address:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <c-lwc-custom-lookup id="billtoaddr" ltng-icon-name="custom:custom11" query-object-api-name="Related_Address__c"
                                            main-object-api-name="Related_Address__c" id-field="Id" name-field="Address_Name__c" scroll-after-n-items=5
                                            result-display-size=10 placeholder="Bill Address" onselectionchange={handleBillToAddressChange}
                                            additional-fields="Address_Street__c,Addresses__r.Address_Country__c"
                                            selection={selection} additional-where-clause={whereBilltoAddress}>
                                        </c-lwc-custom-lookup>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Ship To Address:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <c-lwc-custom-lookup id="shiptoaddr" ltng-icon-name="custom:custom11" query-object-api-name="Related_Address__c"
                                            main-object-api-name="Related_Address__c" id-field="Id" name-field="Address_Name__c" scroll-after-n-items=5
                                            result-display-size=10 placeholder="Ship Address" onselectionchange={handleShipToAddressChange}
                                            additional-fields="Address_Street__c,Addresses__r.Address_Country__c"
                                            selection={selection} additional-where-clause={whereShiptoAddress}>
                                        </c-lwc-custom-lookup>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Delivery Mode:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <c-lwc-custom-lookup id="delmode" ltng-icon-name="custom:custom11" query-object-api-name="Mode_of_delivery__c"
                                            main-object-api-name="Mode_of_delivery__c" id-field="Id" name-field="Name" scroll-after-n-items=5
                                            result-display-size=10 placeholder="Select Delivery Mode..." onselectionchange={handleDeliveryModeChange}>
                                        </c-lwc-custom-lookup>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Method of Payment:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-combobox name="methodOfPayment" options={methodOfPaymentOptions} onchange={handleMethodOfPaymentChange}>
                                        </lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Service:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-combobox name="service" options={serviceOptions} onchange={handleServiceChange}></lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Carrier Account Number:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-input type="text" name="carrieraccno" variant="label-hidden" onchange={handleCarrierAccountNoChange}
                                            value={strCarrierAccountNumber}>
                                        </lightning-input>
                                    </div>

                                </template>

                                <template if:true={showSAPGermanyFields}>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Delivery Date Control:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-combobox name="deliveryDateControl" options={DeliveryDateControlOptions}
                                            onchange={handleDeliveryDateControlChange}></lightning-combobox>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Ship-To Party's PO Date:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-input type="date" name="shiptopartypodate" variant="label-hidden" onchange={handleShipToPartyPODateChange}
                                            value={strShipToPartyPoDate}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Ship-To Party's PO Number:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <lightning-input type="text" name="shiptopartypono" variant="label-hidden" onchange={handleShipToPartyPONumberChange}
                                            value={strShipToPartyPoNumber}>
                                        </lightning-input>
                                    </div>

                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Header Condition Type:</span>
                                    </div>
                                    <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                        <c-lwc-custom-lookup id="itemconditiontype" ltng-icon-name="custom:custom11"
                                            query-object-api-name="Header_Condition_Type__c" main-object-api-name="Header_Condition_Type__c" id-field="Id"
                                            name-field="Name" scroll-after-n-items=5 result-display-size=10 placeholder="Select Header Condition Type..."
                                            nothing-found-subtitle="No Header Contidion Types were found on the selected site"
                                            onselectionchange={handleItemConditionTypeChange} additional-where-clause={whereERPSite}>
                                        </c-lwc-custom-lookup>
                                    </div>

                                    <template if:true={contractEndDate}>

                                        <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                            <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Contract Start Date:</span>
                                        </div>
                                        <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                            <lightning-input type="date" name="input1" variant="label-hidden" onchange={handleCSDateChange} value={CSDate}>
                                            </lightning-input>
                                        </div>

                                        <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                            <span style="font-weight: bold;" class="slds-var-m-top_xx-small">Contract End Date:</span>
                                        </div>
                                        <div class="slds-col slds-var-p-horizontal_small slds-var-m-top_small slds-size_2-of-12">
                                            <lightning-input type="date" name="input1" variant="label-hidden" onchange={handleCEDateChange} value={CEDate}>
                                            </lightning-input>
                                        </div>
                                    </template>

                                </template>
                            </div>
                        </template>
                        <br />
                    </div>
                </template>
                <template if:true={showReplaceResult}>
                    <header>
                        <div class="slds-text-heading_medium"
                            style="background-color: rgb(243, 242, 242); font-size: medium; padding: 7px;">
                            <p style="font-weight: bold;" class="slds-var-m-top_xx-small"> Support Request Lines Details Section </p>
                        </div>
                    </header>
                    <br />
                    <div>
                        <table class={strTableClass} style="width: 100%;">
                            <thead>
                                <tr class="slds-text-heading--label">
                                    <th class="slds-is-sortable" scope="col">
                                        <lightning-input onchange={getSelectedRow} selected type="checkbox"
                                            disabled="true"></lightning-input>
                                    </th>
                                    <th class="slds-is-sortable" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;"
                                            title="Quantity">Support Request Name</div>
                                    </th>
                                    <th class="slds-is-sortable" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;"
                                            title="productCode">Product Code</div>
                                    </th>
                                    <th align="center" class="slds-is-sortable slds-wrap" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;">
                                            Product Name</div>
                                    </th>
                                    <th class="slds-is-sortable slds-wrap" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;">
                                            Application Name</div>
                                    </th>
                                    <th class="slds-is-sortable slds-wrap" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;">
                                            Quantity</div>
                                    </th>
                                    <th class="slds-is-sortable slds-wrap" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;">
                                            Tally</div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={requestLineDetails} for:item="con" for:index="index">
                                    <tr class="slds-hint-parent" key={con.quoteId}>
                                        <td class="slds-truncate" scope="col">
                                            <div class="slds-truncate">
                                                <lightning-input type="checkbox" checked={con.selected} disabled="true">
                                                </lightning-input>
                                            </div>
                                        </td>
                                        <td class="slds-truncate" scope="col">
                                            {con.repProdName}
                                        </td>
                                        <td class="slds-truncate" scope="col">
                                            <div>{con.productCode}</div>
                                        </td>
                                        <td class="slds-truncate slds-cell-wrap" scope="col">
                                            <div>{con.productName}</div>
                                        </td>
                                        <td class="slds-truncate slds-cell-wrap" scope="col">
                                            <div>{con.prodApplication}</div>
                                        </td>
                                        <td class="slds-truncate slds-cell-wrap" scope="col">
                                            <div>{con.productQuantity}</div>
                                        </td>
                                        <td class="slds-truncate slds-cell-wrap" scope="col">
                                            <div>{con.prodTally}</div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template if:true={showOpportunityResult}>
                    <header>
                        <div class="slds-text-heading_medium"
                            style="background-color: rgb(243, 242, 242); font-size: medium; padding: 7px;">
                            <p style="font-weight: bold;" class="slds-var-m-top_xx-small"> Opportunity Lines Details Section </p>
                        </div>
                    </header>
                    <br />
                    <div style="overflow-x: scroll;">
                        <table class={strTableClassCal} style="width:100%">
                            <tr>
                                <td>
                                    <div class={strTableClassCalTd}>Lines Total: <lightning-formatted-number
                                            value={linesGrandTotal} format-style="decimal" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <div class={strTableClassCalTd}>Products Total: <lightning-formatted-number
                                            value={prodGrandTotal} format-style="decimal" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <div class={strTableClassCalTd}>Grand Total: <lightning-formatted-number
                                            value={overAllGrandTotal} format-style="decimal"
                                            minimum-fraction-digits="2"></lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <div class={strTableClassCalTd}>Agreement Total: <lightning-formatted-number
                                            value={agreementAmount} format-style="decimal" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <div class={strTableClassCalTd}>Available Total: <lightning-formatted-number
                                            value={availableTotal} format-style="decimal" minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <div class={strTableClassCalTd}>Cumulative Ordered Total:
                                        <lightning-formatted-number value={usedTotal} format-style="decimal"
                                            minimum-fraction-digits="2"></lightning-formatted-number>
                                    </div>
                                </td>
                            </tr>
                        </table>
                        <table class={strTableClass} style="width: 100%;">
                            <thead>
                                <tr class="slds-text-heading--label">
                                    <th class="slds-is-sortable" scope="col">
                                        <lightning-input onchange={handleSelectAllLines} type="checkbox"
                                            disabled="true">
                                        </lightning-input>
                                    </th>
                                    <th class="slds-is-sortable" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;"
                                            title="Quantity">Opportunity Number</div>
                                    </th>
                                    <th class="slds-is-sortable" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;"
                                            title="productCode">Product Code</div>
                                    </th>
                                    <th align="center" class="slds-is-sortable slds-wrap" scope="col">
                                        <div class="slds-truncate" style="text-transform: capitalize;font-size: 13px;"
                                            title="productName">Product Name</div>
                                    </th>
                                    <th class="slds-is-sortable slds-wrap" scope="col">
